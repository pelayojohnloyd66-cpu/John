<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a1260">
  <title>For you 💜</title>

  <!-- Fonts (needs internet; the site still works with fallback fonts if offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400;1,9..144,600&family=Nunito:wght@400;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

</head>
<body class="is-locked">

  <!-- Ambient dreamy background (stars, glowing orbs, floating hearts) -->
  <canvas id="sky" aria-hidden="true"></canvas>
  <!-- Sparkles and confetti draw on top of everything -->
  <canvas id="fx" aria-hidden="true"></canvas>

  <!-- ========== 1. WELCOME SCREEN ========== -->
  <section id="gate" class="gate" aria-labelledby="gate-name">
    <div class="moon" aria-hidden="true"></div>
    <p class="gate__hint">haiiiuuuu, this one is just for you my</p>
    <h1 id="gate-name" class="gate__name"></h1>
    <button id="open-btn" class="btn btn--glow" type="button">Tap to open 💌</button>
    <p class="gate__desktop">Made for mobiles</p>
  </section>

  <!-- ========== 2. THE WEBSITE ========== -->
  <main id="site" hidden>

    <!-- Top bar: hidden-heart counter -->
    <header class="topbar">
      <p class="pill" id="found-counter" aria-live="polite">💗 0/0</p>
    </header>

    <!-- Hero -->
    <section id="hero" class="hero">
      <p class="hero__kicker" id="hero-kicker"></p>
      <h2 class="hero__title">
        <span class="hero__hi" id="hero-hi"></span>
        <span class="hero__name" id="hero-name"></span>
      </h2>
      <p class="hero__sub" id="hero-sub"></p>
      <a class="btn" href="#letter">Read your letter</a>
    </section>

    <!-- Love letter -->
    <section id="letter" class="section">
      <h2 class="section__title reveal">A little letter for you</h2>
      <p class="section__sub reveal">Tap the envelope</p>

      <div class="envelope-wrap">
        <button id="envelope" class="envelope" type="button" aria-expanded="false" aria-controls="letter-reveal">
          <span class="envelope__body"></span>
          <span class="envelope__flap"></span>
          <span class="envelope__seal" aria-hidden="true">💜</span>
        </button>

        <div id="letter-reveal" class="letter-reveal">
          <div class="letter-reveal__clip">
            <article class="paper">
              <h3 id="letter-greeting" class="paper__greeting"></h3>
              <div id="letter-text" class="paper__text"></div>
              <p id="letter-sign" class="paper__sign" hidden></p>
              <button id="skip-typing" class="link-btn" type="button">Skip the typing</button>
            </article>
          </div>
        </div>
      </div>
    </section>

    <!-- little letters -->
    <section id="notes" class="section">
      <h2 class="section__title reveal" id="notes-title"></h2>
      <p class="section__sub reveal" id="notes-sub"></p>
      <div id="notes-grid" class="notes"></div>
    </section>

    <!-- Surprise button -->
    <section id="surprise" class="section">
      <h2 class="section__title reveal">One more thing…</h2>
      <button id="surprise-btn" class="btn btn--big btn--glow" type="button">Press me 🎀</button>
      <p id="surprise-msg" class="surprise__msg" aria-live="polite"></p>
    </section>

    <footer class="footer">
      <p>Made with 💜 just because you matter most to me.</p>
      <button id="reset-hunt" class="link-btn" type="button">Restart the hidden-heart hunt</button>
    </footer>
  </main>

  <!-- Letter viewer -->
  <div id="note-viewer" class="lightbox" role="dialog" aria-modal="true" aria-label="Letter" hidden>
    <button class="lb-btn lb-close" id="nv-close" type="button" aria-label="Close letter">✕</button>
    <article class="nv-paper" id="nv-paper">
      <p class="nv-emoji" id="nv-emoji" aria-hidden="true"></p>
      <h3 class="nv-title" id="nv-title"></h3>
      <div class="nv-text" id="nv-text"></div>
      <p class="nv-sign" id="nv-sign"></p>
    </article>
    <button class="lb-btn lb-prev" id="nv-prev" type="button" aria-label="Previous letter">‹</button>
    <button class="lb-btn lb-next" id="nv-next" type="button" aria-label="Next letter">›</button>
  </div>

  <!-- Hidden message popup -->
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal__card">
      <p class="modal__emoji" id="modal-emoji" aria-hidden="true">💗</p>
      <h3 class="modal__title" id="modal-title"></h3>
      <p class="modal__text" id="modal-text"></p>
      <button id="modal-close" class="btn" type="button">Aww 💜</button>
    </div>
  </div>

  <script src="script.js" type="module"></script>
</body>
</html>
